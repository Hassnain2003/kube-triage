[project]
name = "kube-triage"
version = "0.1.0"
description = "Read-only AI agent that diagnoses broken Kubernetes deployments."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Hassnain Abbas" }]
dependencies = [
    "groq>=0.11.0",
    "langgraph>=0.2.0",
    "mcp>=1.2.0,<2",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
]

[project.scripts]
kube-triage = "kube_triage.cli:main"
kube-triage-mcp = "kube_triage.mcp_server:main"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.coverage.run]
source = ["kube_triage"]
omit = [
    "src/kube_triage/mcp_server.py",
    "src/kube_triage/eval_harness.py",
    "src/kube_triage/cli.py",
    "src/kube_triage/__main__.py",
]

[tool.coverage.report]
show_missing = true
fail_under = 70
